<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الوسيط - B2B Field Sales</title>
  <style>
    :root {
      --primary: #1E293B;
      --accent: #10B981;
      --bg: #F8FAFC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      background-color: var(--bg);
      color: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .logo-box {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #1E293B, #0F172A);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(30, 41, 59, 0.25);
    }
    .logo-icon {
      font-size: 44px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      color: #64748B;
      font-size: 14px;
      margin-bottom: 30px;
      max-width: 320px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 320px;
      padding: 16px 24px;
      background-color: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .server-status {
      margin-top: 24px;
      font-size: 12px;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="logo-box">
    <span class="logo-icon">🚚</span>
  </div>
  <h1>تطبيق الوسيط</h1>
  <p>نظام إدارة المبيعات الميدانية والتوزيع B2B</p>
  
  <button class="btn" onclick="connectToServer()">
    الدخول للنظام الميداني
  </button>

  <div class="server-status">
    <span class="dot"></span>
    <span>متصل بخادم المركز (VPS / Port 8889)</span>
  </div>

  <script>
    function connectToServer() {
      // Direct redirect to the live server
      window.location.href = "http://192.168.8.94:8889";
    }
    // Auto redirect if online
    setTimeout(function() {
      fetch("http://192.168.8.94:8889/login", { mode: 'no-cors' })
        .then(() => { window.location.href = "http://192.168.8.94:8889"; })
        .catch(() => {});
    }, 1000);
  </script>
</body>
</html>
